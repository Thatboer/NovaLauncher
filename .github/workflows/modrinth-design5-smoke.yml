name: Nova Design 5 source integration check

on:
  push:
    branches: [modrinth-design5]
    paths:
      - 'nova/**'
      - '.github/workflows/modrinth-design5-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nova-design5-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-overlay:
    name: Patch pinned Modrinth and verify Nova chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: f73010ae0809813120a16b733a3d0bfd23f76e24
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          git init -q modrinth-upstream
          git -C modrinth-upstream remote add origin https://github.com/modrinth/code.git
          git -C modrinth-upstream fetch --depth 1 origin "$SOURCE_SHA"
          git -C modrinth-upstream checkout -q --detach FETCH_HEAD
          test "$(git -C modrinth-upstream rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Apply Design #5 Nova overlay
        run: node nova/apply.mjs modrinth-upstream
      - name: Confirm no ad startup, green brand, or legacy chrome in patched frontend
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs'
          function load(p) { return fs.readFileSync('modrinth-upstream/apps/app-frontend/src/' + p, 'utf8') }
          const app = load('App.vue')
          const title = load('app/shell/title-bar/index.vue')
          const index = load('pages/Index.vue')
          const theme = load('features/nova/nova-theme.css')
          const account = load('features/nova/NovaAccounts.vue')
          const settings = load('features/nova/NovaSettings.vue')
          const sidebar = load('features/nova/NovaSidebar.vue')
          const nova = load('features/nova/NovaPage.vue')
          const splash = load('components/ui/SplashScreen.vue')
          const html = fs.readFileSync('modrinth-upstream/apps/app-frontend/index.html','utf8')
          const appConfig = JSON.parse(fs.readFileSync('modrinth-upstream/apps/app/tauri.conf.json','utf8'))
          const nsis = fs.readFileSync('modrinth-upstream/apps/app/nsis/hooks.nsi','utf8')
          const checks = {
            noConsentStartup: !app.includes('handleAdsConsentRequired(await should_show_ads_consent_popup())'),
            noAdWindowInitialization: !app.includes('await init_ads_window('),
            adContextDisabled: app.includes('const showAd = computed(() => false)'),
            adConsentContextDisabled: app.includes('const adConsentAvailable = computed(() => false)'),
            noSurveyPromotions: !app.includes('<SurveyPopup />'),
            novaTitle: title.includes('Minecraft Java Launcher') && !title.includes('<AppActionBar />') && !title.includes('<TextLogo'),
            novaLeftNavigation: app.includes('<NovaSidebar '),
            novaPages: index.includes('<NovaPage'),
            brandPurpleTokens: theme.includes('--color-brand: #bd7af9 !important'),
            noLegacyAccountCard: account.includes('get_default_user') && !account.includes('<AccountsCard'),
            noSmpPrefill: !nova.includes('NOVASMP_ADDRESS') && !nova.includes('NovaSMP') && !nova.includes('novasmp.gg'),
            novaGalaxyLogoCopied: fs.existsSync('modrinth-upstream/apps/app-frontend/src/features/nova/nova-logo.svg'),
            novaHomeLogo: nova.includes('nova-logo.svg'),
            novaSplashLogo: splash.includes('nova-logo.svg') && !splash.includes('id="modrinth-app-logo"'),
            htmlNova: html.includes('<title>Nova Launcher</title>') && !html.includes('<title>Modrinth App</title>'),
            tauriNova: appConfig.productName === 'Nova Launcher' && appConfig.mainBinaryName === 'NovaLauncher',
            nsisNova: !nsis.includes('An old installation of the Modrinth App'),
            nativeSettings: nova.includes('<NovaSettings') && settings.includes('await get()') && settings.includes('await set(next)'),
            functionalAppearance: settings.includes('--nova-glass-opacity') && settings.includes('localStorage.setItem('),
            nativeInstalledMods: nova.includes('get_content_items') && nova.includes('toggle_disable_project'),
            instanceFilters: nova.includes('visibleInstances') && nova.includes('nova-filter-pills'),
            viteSceneAsset: nova.includes("cherry-grove.avif?url") && theme.includes('--nova-scene-url'),
            viteLogoAsset: nova.includes("nova-logo.svg?url") && sidebar.includes("nova-logo.svg?url"),
            defaultNoProviderBrand: !nova.includes('Modrinth returned HTTP'),
            oldSettingsButtonRemoved: !nova.includes('Open launcher settings'),
            noFullWidthAuthWarning: app.includes('nova-auth-notice') && !app.includes('v-if="authUnreachable"\\n\\t\\t\\t\\ttype="warning"'),
            authCheckStillPresent: app.includes('await check_reachable()') && app.includes('authServerQuery.refetch()'),
            noBrokenTitlebarIconUrl: title.includes(':src="novaLogoUrl"') && !title.includes('src="@/features/nova/nova-logo.svg"'),
            titleSfcNotTruncated: title.includes('import novaLogoUrl from') &&
              title.indexOf('</script>') > 0 &&
              title.indexOf('<template>') > title.indexOf('</script>') &&
              title.indexOf('</header>') < title.indexOf('</template>'),

            noBrokenSplashIconUrl: splash.includes(':src="novaLogoUrl"') && !splash.includes('src="@/features/nova/nova-logo.svg"'),
            creationDialogScoped: app.includes('class="nova-create-instance-modal"') && theme.includes('.nova-create-instance-modal'),
            sharperGlassTheme: theme.includes('NOVA v0.7 FINAL VISUAL PASS'),
            functionalGlassSlider: theme.includes('--nova-glass-opacity:inherit!important'),
            structuredServerLayout: nova.includes('nova-server-grid') && nova.includes('nova-server-quick-controls'),
            noForcedServer: !nova.includes('novasmp.gg'),
          }
          console.log(checks)
          if (Object.values(checks).some(v => !v)) process.exit(1)
          NODE
