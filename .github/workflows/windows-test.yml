name: Nova Launcher Windows test installer

# Build only on request. Prevents costly rebuilds for each artwork or docs change.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-test-installer:
    name: Unsigned Windows installer
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      CI: "true"
    steps:
      - name: Check out Nova source
        uses: actions/checkout@v4

      - name: Build unsigned Nova Launcher
        shell: powershell
        run: .\nova\build-windows.ps1

      - name: Upload installer and SHA256
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NovaLauncher-Windows-Unsigned-${{ github.run_number }}
          path: |
            out/*.exe
            out/*.sha256
          if-no-files-found: error
          retention-days: 14
