<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="Nova Launcher, Minecraft Java Edition, lavender glass and cherry blossom theme">
<defs>
<linearGradient id="sky" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#22183f"/><stop offset=".43" stop-color="#684c9e"/><stop offset=".74" stop-color="#af71c3"/><stop offset="1" stop-color="#f7b5b3"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4a2871" stop-opacity=".96"/><stop offset="1" stop-color="#342353" stop-opacity=".62"/></linearGradient>
